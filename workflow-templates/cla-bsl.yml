name: CLA

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    uses: divmora/.github/.github/workflows/cla-bsl.yml@main
    # Optional: use this repository's own CLA instead of the org-wide CLA-BSL.md.
    # Signatures for it are stored separately from the org CLA.
    # with:
    #   cla-document: https://github.com/divmora/${{ github.event.repository.name }}/blob/main/CLA.md
    secrets:
      CLA_PAT: ${{ secrets.CLA_PAT }}
