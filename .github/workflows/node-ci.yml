name: "Node.js CI (Reusable)"

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '24'
        description: 'Node.js version to test against (e.g. "24")'
      package-manager:
        type: string
        required: false
        default: 'pnpm'
        description: 'Package manager: pnpm, npm, or yarn'
      pnpm-version:
        type: string
        required: false
        default: ''
        description: 'Optional pnpm version to install (leave empty to auto-detect from package.json packageManager)'
      working-directory:
        type: string
        required: false
        default: '.'
        description: 'Working directory containing package.json'
      install-command:
        type: string
        required: false
        default: ''
        description: 'Custom install command (overrides default for package manager)'
      lint-command:
        type: string
        required: false
        default: ''
        description: 'Lint command to run (e.g. "pnpm lint" or "npm run lint")'
      test-command:
        type: string
        required: false
        default: 'test'
        description: 'Test script name or custom test command (e.g. "test" or "pnpm test")'
      build-command:
        type: string
        required: false
        default: ''
        description: 'Build command to run (e.g. "pnpm build" or "npm run build")'
      enable-build:
        type: boolean
        required: false
        default: false
        description: 'Whether to execute the build step after tests'

jobs:
  test:
    name: Node.js CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm (if pnpm is used)
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version || '' }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json' }}

      - name: Install dependencies (custom command)
        if: inputs.install-command != ''
        run: ${{ inputs.install-command }}

      - name: Install dependencies (pnpm)
        if: inputs.install-command == '' && inputs.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (yarn)
        if: inputs.install-command == '' && inputs.package-manager == 'yarn'
        run: yarn install --frozen-lockfile

      - name: Install dependencies (npm)
        if: inputs.install-command == '' && inputs.package-manager == 'npm'
        run: npm ci

      - name: Run Linters (if configured)
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

      - name: Run Tests
        env:
          TEST_CMD: ${{ inputs.test-command }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          if [[ "$TEST_CMD" == *" "* ]]; then
            $TEST_CMD
          elif [ "$PKG_MGR" = "pnpm" ]; then
            pnpm "$TEST_CMD"
          elif [ "$PKG_MGR" = "yarn" ]; then
            yarn "$TEST_CMD"
          else
            npm run "$TEST_CMD"
          fi

      - name: Run Build (if enabled)
        if: inputs.enable-build && inputs.build-command != ''
        run: ${{ inputs.build-command }}
