name: "Python CI (Reusable)"

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: false
        default: '3.11'
        description: 'Python version to test against (e.g. "3.11", "3.12")'
      working-directory:
        type: string
        required: false
        default: '.'
        description: 'Working directory'
      install-command:
        type: string
        required: false
        default: 'pip install -e ".[dev]" || pip install -r requirements.txt || pip install -e .'
        description: 'Command to install project dependencies'
      lint-command:
        type: string
        required: false
        default: ''
        description: 'Lint command to run (e.g. "ruff check ." or "flake8")'
      test-command:
        type: string
        required: false
        default: 'pytest -v'
        description: 'Test command to run (e.g. "pytest -v")'

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          ${{ inputs.install-command }}

      - name: Run Linters (if configured)
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

      - name: Run Tests
        run: ${{ inputs.test-command }}
