name: "Release Please & GoReleaser (Reusable)"

on:
  workflow_call:
    inputs:
      config-file:
        type: string
        required: false
        default: '.release-please-config.json'
      manifest-file:
        type: string
        required: false
        default: '.release-please-manifest.json'
      force-release:
        type: boolean
        required: false
        default: false
      tag-name:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: false
        default: ''

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created || inputs.force-release }}
      tag_name: ${{ steps.release.outputs.tag_name || inputs.tag-name }}
      version: ${{ steps.release.outputs.version || inputs.version }}
    steps:
      - name: Run Release Please Action
        id: release
        if: ${{ !inputs.force-release }}
        uses: googleapis/release-please-action@v4
        with:
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

  goreleaser:
    name: GoReleaser Release
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' || needs.release-please.outputs.releases_created == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag-name || '' }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Pre-Compute Release Signature
        if: env.DIVMORA_RELEASE_PRIVATE_KEY != '' && hashFiles('cmd/fleet-license-gen/**') != ''
        env:
          DIVMORA_RELEASE_PRIVATE_KEY: ${{ secrets.DIVMORA_RELEASE_PRIVATE_KEY }}
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          VERSION="${VERSION:-${TAG_NAME#v}}"
          echo "Generating cryptographic release signature for version ${VERSION} (${COMMIT})..."
          go run ./cmd/fleet-license-gen sign-release \
            --version="${VERSION}" \
            --commit="${COMMIT}" \
            --build-date="${BUILD_DATE}" \
            --private-key="$DIVMORA_RELEASE_PRIVATE_KEY" \
            -o ./release.sig
          echo "RELEASE_SIG=$(cat ./release.sig)" >> $GITHUB_ENV
          mkdir -p .git/info
          echo "release.sig" >> .git/info/exclude

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SIG: ${{ env.RELEASE_SIG }}

      - name: Upload Release Signature Asset
        if: env.DIVMORA_RELEASE_PRIVATE_KEY != '' && hashFiles('./release.sig') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "${TAG_NAME}" ./release.sig --clobber || true
