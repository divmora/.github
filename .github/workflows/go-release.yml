name: "Release Please & GoReleaser (Reusable)"

on:
  workflow_call:
    inputs:
      config-file:
        type: string
        required: false
        default: '.release-please-config.json'
      manifest-file:
        type: string
        required: false
        default: '.release-please-manifest.json'
      force-release:
        type: boolean
        required: false
        default: false
      tag-name:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: false
        default: ''
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: "Private key of the DIVMORA Release GitHub App (optional; passed automatically with `secrets: inherit`)."
        required: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Secrets cannot be used in `if:`; expose only whether the key was passed.
      HAS_RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created || inputs.force-release }}
      tag_name: ${{ steps.release.outputs.tag_name || inputs.tag-name }}
      version: ${{ steps.release.outputs.version || inputs.version }}
    steps:
      # Release PRs are opened with a short-lived token from the DIVMORA Release
      # GitHub App so that CI and the CLA check run on them (PRs opened with
      # GITHUB_TOKEN trigger no workflows). The token is limited to this
      # repository and to contents + pull-requests, and is revoked when the job
      # ends. Without the app variable/secret this falls back to GITHUB_TOKEN.
      - name: Create release-PR token (DIVMORA Release app)
        id: app-token
        if: ${{ !inputs.force-release && vars.RELEASE_APP_CLIENT_ID != '' && env.HAS_RELEASE_APP_KEY == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # Tags and GitHub releases stay on GITHUB_TOKEN on purpose: tags pushed by
      # GITHUB_TOKEN do not trigger tag-based workflows, so release behaviour
      # is unchanged.
      - name: Create GitHub releases
        id: release
        if: ${{ !inputs.force-release }}
        uses: googleapis/release-please-action@v5
        with:
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          skip-github-pull-request: true

      - name: Open or update release PR
        if: ${{ !inputs.force-release }}
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          skip-github-release: true

  goreleaser:
    name: GoReleaser Release
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' || needs.release-please.outputs.releases_created == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DIVMORA_RELEASE_PRIVATE_KEY: ${{ secrets.DIVMORA_RELEASE_PRIVATE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag-name || '' }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Pre-Compute Release Signature
        if: env.DIVMORA_RELEASE_PRIVATE_KEY != ''
        env:
          DIVMORA_RELEASE_PRIVATE_KEY: ${{ secrets.DIVMORA_RELEASE_PRIVATE_KEY }}
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          VERSION="${VERSION:-${TAG_NAME#v}}"
          echo "Generating cryptographic release signature for version ${VERSION} (${COMMIT})..."
          if [ -d "./cmd/license-cli" ]; then
            go install ./cmd/license-cli
          else
            go install github.com/divmora/license-go/cmd/license-cli@latest
          fi
          KEY_FILE=$(mktemp)
          if [ -f "$DIVMORA_RELEASE_PRIVATE_KEY" ]; then
            cp "$DIVMORA_RELEASE_PRIVATE_KEY" "$KEY_FILE"
          else
            echo "$DIVMORA_RELEASE_PRIVATE_KEY" > "$KEY_FILE"
          fi
          PRODUCT="${GITHUB_REPOSITORY#*/}"
          
          # Pre-compile host binary if needed for digest computation
          BINARY_ARG=""
          if [ -d "./cmd/${PRODUCT}" ]; then
            mkdir -p bin
            CGO_ENABLED=0 go build -trimpath -o "./bin/${PRODUCT}" "./cmd/${PRODUCT}" || true
            if [ -f "./bin/${PRODUCT}" ]; then
              BINARY_ARG="-binary ./bin/${PRODUCT}"
            fi
          elif [ -f "./bin/${PRODUCT}" ]; then
            BINARY_ARG="-binary ./bin/${PRODUCT}"
          fi
          
          license-cli release sign \
            -private-key "$KEY_FILE" \
            -product "$PRODUCT" \
            -version "$VERSION" \
            -git-commit "$COMMIT" \
            -build-date "$BUILD_DATE" \
            $BINARY_ARG \
            -out ./release.sig \
            -armored
          rm -f "$KEY_FILE"
          if [ -d "./bin" ]; then
            cp ./release.sig ./bin/release.sig || true
          fi
          {
            echo "RELEASE_SIG<<EOF"
            cat ./release.sig
            echo "EOF"
          } >> "$GITHUB_ENV"
          mkdir -p .git/info
          echo "release.sig" >> .git/info/exclude

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SIG: ${{ env.RELEASE_SIG }}

      - name: Upload Release Signature Asset
        if: env.DIVMORA_RELEASE_PRIVATE_KEY != '' && hashFiles('./release.sig') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "${TAG_NAME}" ./release.sig --clobber || true
