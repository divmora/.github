name: "Release Please (Reusable)"

on:
  workflow_call:
    inputs:
      config-file:
        type: string
        required: false
        default: '.release-please-config.json'
      manifest-file:
        type: string
        required: false
        default: '.release-please-manifest.json'
    outputs:
      releases_created:
        description: "True if a release was created"
        value: ${{ jobs.release-please.outputs.releases_created }}
      tag_name:
        description: "The tag of the created release"
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: "The version string of the created release"
        value: ${{ jobs.release-please.outputs.version }}
    secrets:
      RELEASE_APP_CLIENT_ID:
        description: "Client ID of the DIVMORA Release GitHub App (optional; passed automatically with `secrets: inherit`)."
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: "Private key of the DIVMORA Release GitHub App (optional; passed automatically with `secrets: inherit`)."
        required: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Secrets cannot be used in `if:`; expose only whether both were passed.
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_CLIENT_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Release tags, GitHub releases and release PRs are created with a
      # short-lived token from the DIVMORA Release GitHub App, because anything
      # created with GITHUB_TOKEN triggers no workflows. With the app token:
      #   - pushing the release tag starts the repo's tag-triggered workflows,
      #     such as docker-publish.yml, so images are built without a manual
      #     workflow_dispatch;
      #   - CI and the CLA check run on release PRs.
      # The token is limited to this repository and to contents + pull-requests,
      # and is revoked when the job ends. Without the app secrets this falls
      # back to GITHUB_TOKEN, and tag-triggered workflows must be started by hand.
      - name: Create release token (DIVMORA Release app)
        id: app-token
        if: ${{ env.HAS_RELEASE_APP == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create GitHub releases
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          skip-github-pull-request: true

      - name: Open or update release PR
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          skip-github-release: true
