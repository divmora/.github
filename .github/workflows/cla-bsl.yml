name: "CLA Assistant — BSL (Reusable)"

# Enforces CLA-BSL.md on BSL 1.1 repositories using CLA Assistant Lite.
# Signatures are stored centrally in divmora/cla-signatures, so a contributor
# signs once for every BSL repository.
#
# Callers must trigger on `pull_request_target` and `issue_comment`, grant the
# permissions below, and pass the CLA_PAT org secret (fine-grained PAT with
# Contents: read & write on divmora/cla-signatures). See
# workflow-templates/cla-bsl.yml for the caller.

on:
  workflow_call:
    secrets:
      CLA_PAT:
        required: true

concurrency:
  # Serialise writes to the shared signatures file within this repository.
  group: cla-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA check
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # Does not check out or run PR code, so pull_request_target is safe here.
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-document: https://github.com/divmora/.github/blob/main/CLA-BSL.md
          remote-organization-name: divmora
          remote-repository-name: cla-signatures
          branch: main
          path-to-signatures: signatures/bsl/v1.json
          allowlist: dependabot[bot],renovate[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          signed-commit-message: "chore: $contributorName signed the BSL CLA in $owner/$repo#$pullRequestNo"
          create-file-commit-message: "chore: create BSL CLA signatures file"
