name: "CLA Assistant — BSL (Reusable)"

# Enforces a CLA on BSL 1.1 repositories using CLA Assistant Lite, with
# signatures stored centrally in divmora/cla-signatures.
#
# By default it enforces the org-wide CLA-BSL.md, and one signature covers
# every repository that uses it (signatures/bsl/v1.json).
#
# A repository may use its own CLA instead by setting `cla-document`. Its
# signatures are then kept separately in signatures/repos/<repo>/v1.json, so
# signing the org CLA never counts as signing a repo-specific one (or vice
# versa). When a repo-specific CLA changes materially, bump the version by
# setting `signatures-path` (e.g. signatures/repos/<repo>/v2.json) so
# contributors sign again.
#
# Callers must trigger on `pull_request_target` and `issue_comment`, grant the
# permissions below, and pass the CLA_PAT org secret (fine-grained PAT with
# Contents: read & write on divmora/cla-signatures). See
# workflow-templates/cla-bsl.yml for the caller.

on:
  workflow_call:
    inputs:
      cla-document:
        description: >-
          URL of a repository-specific CLA (e.g. https://github.com/divmora/<repo>/blob/main/CLA.md).
          Leave empty to use the org-wide CLA-BSL.md.
        type: string
        default: ""
      signatures-path:
        description: >-
          Override the signatures file in divmora/cla-signatures. Defaults to
          signatures/bsl/v1.json, or signatures/repos/<repo>/v1.json when cla-document is set.
        type: string
        default: ""
    secrets:
      CLA_PAT:
        required: true

concurrency:
  # Serialise writes to the shared signatures file within this repository.
  group: cla-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA check
    runs-on: ubuntu-latest
    # Comment matching is loose on purpose: GitHub often appends newlines to
    # comments, and contains()/startsWith() are case-insensitive. The action
    # itself trims, lowercases and re-validates the signing phrase.
    # Dependabot-triggered runs cannot read Actions secrets (CLA_PAT), so skip
    # them; a skipped job satisfies a required status check. A human pushing to
    # a Dependabot PR is the actor of that run, so they are still checked.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (startsWith(github.event.comment.body, 'recheck') ||
         contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))))
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # Does not check out or run PR code, so pull_request_target is safe here.
      - uses: divmora/cla-assistant-action@82c0f9527bd840d84716a84fe46eb250ed11b071 # v3.0.1 (DIVMORA fork, Node.js 24)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-document: ${{ inputs.cla-document || 'https://github.com/divmora/.github/blob/main/CLA-BSL.md' }}
          remote-organization-name: divmora
          remote-repository-name: cla-signatures
          branch: main
          path-to-signatures: >-
            ${{ inputs.signatures-path
            || (inputs.cla-document && format('signatures/repos/{0}/v1.json', github.event.repository.name))
            || 'signatures/bsl/v1.json' }}
          allowlist: dependabot[bot],renovate[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          signed-commit-message: "chore: $contributorName signed the CLA in $owner/$repo#$pullRequestNo"
          create-file-commit-message: "chore: create CLA signatures file"
