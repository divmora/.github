name: "CloudFormation CI (Reusable)"

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: false
        default: '3.12'
        description: 'Python version for cfn-lint runner'

jobs:
  validate:
    name: Lint CloudFormation Templates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install CloudFormation & YAML Linters
        run: |
          python -m pip install --upgrade pip
          pip install cfn-lint yamllint

      - name: Lint CloudFormation Templates
        run: |
          python3 -c "
          import glob, subprocess, sys

          candidates = set(glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True))
          templates = [
              f for f in sorted(candidates)
              if not f.startswith('.github/')
              and not f.startswith('.tmp/')
              and not f.startswith('.git/')
              and not f.startswith('node_modules/')
              and not f.startswith('.aws-sam/')
          ]

          if not templates:
              print('No CloudFormation templates found to lint.')
              sys.exit(0)

          print(f'Linting {len(templates)} template(s): {templates}')
          result = subprocess.run(['cfn-lint'] + templates)
          sys.exit(result.returncode)
          "
