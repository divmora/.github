name: "CloudFormation CI (Reusable)"

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: false
        default: '3.12'
        description: 'Python version for cfn-lint runner'
      template-directory:
        type: string
        required: false
        default: ''
        description: 'Optional directory containing CloudFormation templates'
      template-pattern:
        type: string
        required: false
        default: ''
        description: 'Optional glob pattern for CloudFormation templates'

jobs:
  validate:
    name: Lint CloudFormation Templates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install CloudFormation & YAML Linters
        run: |
          python -m pip install --upgrade pip
          pip install cfn-lint yamllint

      - name: Lint CloudFormation Templates
        run: |
          python3 -c "
          import glob, os, subprocess, sys

          template_dir = '${{ inputs.template-directory }}'.strip()
          template_pattern = '${{ inputs.template-pattern }}'.strip()

          def is_cfn_file(path):
              try:
                  with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                      for line in f:
                          stripped = line.strip()
                          if stripped.startswith(('AWSTemplateFormatVersion:', 'Resources:', 'Transform:')):
                              return True
              except Exception:
                  pass
              return False

          if template_pattern:
              candidates = glob.glob(template_pattern, recursive=True)
          elif template_dir:
              candidates = glob.glob(os.path.join(template_dir, '**/*.yaml'), recursive=True) + glob.glob(os.path.join(template_dir, '**/*.yml'), recursive=True)
          else:
              all_files = glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True)
              ignored_prefixes = ('.github/', '.tmp/', '.git/', 'node_modules/', '.aws-sam/', 'dist/', 'build/')
              candidates = [
                  f for f in all_files
                  if not any(f.startswith(p) or f'/{p}' in f for p in ignored_prefixes)
                  and is_cfn_file(f)
              ]

          templates = sorted(set(candidates))

          if not templates:
              print('No CloudFormation templates found to lint.')
              sys.exit(0)

          print(f'Linting {len(templates)} template(s): {templates}')
          result = subprocess.run(['cfn-lint'] + templates)
          sys.exit(result.returncode)
          "
