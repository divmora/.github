name: "Go CI (Reusable)"

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        required: false
        default: '1.26'
      golangci-lint-version:
        description: >-
          golangci-lint release to install (e.g. v2.15.0). Pinned so a new upstream
          release cannot break callers without a code change; bumped via Renovate PRs.
          Callers may override this to stay on an older release while migrating.
        type: string
        required: false
        # renovate: datasource=github-releases depName=golangci/golangci-lint
        default: 'v2.15.0'
      node-version:
        description: >-
          Set up Node.js (e.g. '24') before the Go checks, for a pre-build-command
          that needs it. Empty: no Node.
        type: string
        required: false
        default: ''
      node-cache-dependency-path:
        description: "Lockfile for the npm cache (e.g. web/package-lock.json). Empty: no cache."
        type: string
        required: false
        default: ''
      pre-build-command:
        description: >-
          Command run after checkout, before lint and tests: for code the Go build
          needs but that isn't committed, e.g. a web UI it embeds (make web).
          Empty: nothing.
        type: string
        required: false
        default: ''

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Set up Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.node-cache-dependency-path != '' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.node-cache-dependency-path }}

      - name: Pre-build
        if: inputs.pre-build-command != ''
        env:
          PRE_BUILD_COMMAND: ${{ inputs.pre-build-command }}
        run: bash -euo pipefail -c "$PRE_BUILD_COMMAND"

      - name: Run Linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-lint-version }}
          install-mode: goinstall
          working-directory: .
          args: --timeout=5m

      - name: Run Unit Tests
        run: go test ./... -v
