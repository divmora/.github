name: "Go CI (Reusable)"

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        required: false
        default: '1.26'
      golangci-lint-version:
        description: >-
          golangci-lint release to install (e.g. v2.15.0). Pinned so a new upstream
          release cannot break callers without a code change; bumped via Renovate PRs.
          Callers may override this to stay on an older release while migrating.
        type: string
        required: false
        # renovate: datasource=github-releases depName=golangci/golangci-lint
        default: 'v2.15.0'

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run Linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-lint-version }}
          install-mode: goinstall
          working-directory: .
          args: --timeout=5m

      - name: Run Unit Tests
        run: go test ./... -v
